[package]
name = "publictransport"
description = "Client for public transport APIs that builds requests and parses responses without doing any I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Of the transport-apis submodule, only the entries that are compiled in
# and its license go into the package.
exclude = [
    "/data/transport-apis/**",
    "!/data/transport-apis/license",
    "!/data/transport-apis/data/un/transitous.json",
    "!/data/transport-apis/data/de/vbb-hafas-mgate.json",
]

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
roxmltree = "0.21.2"

[features]
# Exports the types and functions to other languages through UniFFI.
uniffi = ["dep:uniffi"]

[dependencies]
# Bindings and library must come from the same UniFFI version.
uniffi = { version = "=0.32.2", optional = true, default-features = false }
form_urlencoded = "1.2.2"
jiff = { version = "1.0.0", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
