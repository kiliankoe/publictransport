[package]
name = "publictransport"
description = "Client for public transport APIs that builds requests and parses responses without doing any I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
# Of the transport-apis submodule, only the entries that are compiled in
# and its license go into the package.
exclude = [
    "/data/transport-apis/**",
    "!/data/transport-apis/license",
    "!/data/transport-apis/data/un/transitous.json",
    "!/data/transport-apis/data/no/entur-otp.json",
    "!/data/transport-apis/data/at/oebb-hafas-mgate.json",
    "!/data/transport-apis/data/at/ooevv-hafas-mgate.json",
    "!/data/transport-apis/data/at/salzburg-hafas-mgate.json",
    "!/data/transport-apis/data/at/stv-hafas-mgate.json",
    "!/data/transport-apis/data/at/svv-hafas-mgate.json",
    "!/data/transport-apis/data/at/vkg-hafas-mgate.json",
    "!/data/transport-apis/data/at/vor-hafas-mgate.json",
    "!/data/transport-apis/data/at/vvt-hafas-mgate.json",
    "!/data/transport-apis/data/at/vvv-hafas-mgate.json",
    "!/data/transport-apis/data/ch/tpg-hafas-mgate.json",
    "!/data/transport-apis/data/de/avv-hafas-mgate.json",
    "!/data/transport-apis/data/de/bvg-hafas-mgate.json",
    "!/data/transport-apis/data/de/db-busradar-nrw-hafas-mgate.json",
    "!/data/transport-apis/data/de/db-sbahn-muenchen-hafas-mgate.json",
    "!/data/transport-apis/data/de/db-smartrbl-hafas-mgate.json",
    "!/data/transport-apis/data/de/gvh-hafas-mgate.json",
    "!/data/transport-apis/data/de/invg-hafas-mgate.json",
    "!/data/transport-apis/data/de/kvb-hafas-mgate.json",
    "!/data/transport-apis/data/de/nahsh-hafas-mgate.json",
    "!/data/transport-apis/data/de/nasa-hafas-mgate.json",
    "!/data/transport-apis/data/de/nvv-hafas-mgate.json",
    "!/data/transport-apis/data/de/rmv-hafas-mgate.json",
    "!/data/transport-apis/data/de/rsag-hafas-mgate.json",
    "!/data/transport-apis/data/de/saarvv-hafas-mgate.json",
    "!/data/transport-apis/data/de/vbb-hafas-mgate.json",
    "!/data/transport-apis/data/de/vbn-hafas-mgate.json",
    "!/data/transport-apis/data/de/vmt-hafas-mgate.json",
    "!/data/transport-apis/data/de/vos-hafas-mgate.json",
    "!/data/transport-apis/data/de/vsn-hafas-mgate.json",
    "!/data/transport-apis/data/dk/rejseplanen-hafas-mgate.json",
    "!/data/transport-apis/data/ie/iarnrod-eireann-hafas-mgate.json",
    "!/data/transport-apis/data/lu/mobiliteit-lu-hafas-mgate.json",
    "!/data/transport-apis/data/se/resrobot-hafas-mgate.json",
    "!/data/transport-apis/data/us/bart-hafas-mgate.json",
    "!/data/transport-apis/data/us/dart-hafas-mgate.json",
]

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
roxmltree = "0.21.2"

[features]
# Exports the types and functions to other languages through UniFFI.
uniffi = ["dep:uniffi"]

[dependencies]
# Bindings and library must come from the same UniFFI version.
uniffi = { version = "=0.32.2", optional = true, default-features = false }
form_urlencoded = "1.2.2"
jiff = { version = "1.0.0", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
