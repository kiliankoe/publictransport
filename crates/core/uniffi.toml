# Settings for the bindings that UniFFI generates from this crate.

# A local time is a `datetime` with the offset of its place.
[bindings.python.custom_types.LocalTime]
type_name = "datetime.datetime"
imports = ["datetime"]
lift = "datetime.datetime.fromisoformat({})"
lower = "{}.isoformat()"

[bindings.swift.rename]
# `Error` is the name of Swift's own protocol for errors.
Error = "PublicTransportError"
# These three are also names in Foundation and the Objective-C runtime, so
# a file that imports Foundation could not name them.
Protocol = "NetworkProtocol"
Operation = "NetworkOperation"
Method = "HttpMethod"
# Names and labels as Swift writes them. UniFFI renames the methods of an
# object here, not those of a record; scripts/swift-idioms.py does those.
"Registry.get" = "network"
"Registry.covering.position" = "at"
# `timeZone` is the `TimeZone` itself there.
"Location.timezone" = "time_zone_identifier"
"Network.timezone" = "time_zone_identifier"

[bindings.kotlin]
# Short like the names of the other packages, and no part of a domain.
package_name = "publictransport"
# Records are data classes with `val` fields; `copy` changes one.
generate_immutable_records = true

# A local time is an `OffsetDateTime` with the offset of its place.
[bindings.kotlin.custom_types.LocalTime]
type_name = "java.time.OffsetDateTime"
lift = "java.time.OffsetDateTime.parse({})"
lower = "{}.format(java.time.format.DateTimeFormatter.ISO_OFFSET_DATE_TIME)"

[bindings.kotlin.rename]
# UniFFI names an error `Error` after Kotlin's own `Exception`. With this
# it becomes `PublicTransportException`.
Error = "PublicTransportError"
# An exception has a `message` already, so a field of that name does not
# compile.
"Error.InvalidNetwork.message" = "detail"
"Error.InvalidQuery.message" = "detail"
"Error.Unsupported.message" = "detail"
"Error.NotFound.message" = "detail"
"Error.Server.message" = "detail"
"Error.Parse.message" = "detail"
