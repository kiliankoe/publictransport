[advisories]
ignore = [
  # basic-toml is unmaintained. It only comes in through the generator of
  # UniFFI, which runs at build time and is not part of the library.
  "RUSTSEC-2026-0374",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  # The Unicode data tables in unicode-ident, which the derive macros use.
  "Unicode-3.0",
  # The TLS stack of reqwest and the root certificates it bundles on Android.
  "ISC",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  # UniFFI. Its copyleft covers UniFFI's own files only.
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
