name: Release

# Publishes the version that Cargo.toml names: the Swift binary as an asset
# of a GitHub release, the crates on crates.io, the Python package on PyPI,
# the Kotlin package on Maven Central and the TypeScript package on npm.
# CONTRIBUTING.md describes the steps before and after.
#
# The run makes the tag itself. The Swift package names the checksum of
# its binary in Package.swift, so the tagged commit can only exist once
# the binary is built.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish. Without it the run builds and tests everything, and nothing leaves it.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          grep -q "^version = \"$version\"$" packages/python/pyproject.toml ||
            { echo "::error::pyproject.toml has another version than Cargo.toml"; exit 1; }
          grep -q "^  \"version\": \"$version\",$" packages/typescript/package.json ||
            { echo "::error::package.json has another version than Cargo.toml"; exit 1; }
          grep -q "^## $version " CHANGELOG.md ||
            { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - if: inputs.publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a release is published from main"; exit 1
          fi
          if git rev-parse --quiet --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::the tag v$VERSION exists"; exit 1
          fi

  xcframework:
    runs-on: macos-26
    outputs:
      checksum: ${{ steps.pack.outputs.checksum }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The network data of transport-apis.
          submodules: true
      # The development shell has the Rust targets of every Apple platform.
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Swatinem/rust-cache@v2
      - run: nix develop -c scripts/build-swift.sh xcframework
      # Against the macOS part of the framework that gets published.
      - run: swift test
        env:
          PUBLICTRANSPORT_LOCAL_BINARY: 1
      - id: pack
        working-directory: packages/swift
        run: |
          ditto -c -k --sequesterRsrc --keepParent PublicTransportBinary.xcframework PublicTransportBinary.xcframework.zip
          echo "checksum=$(swift package compute-checksum PublicTransportBinary.xcframework.zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: xcframework
          path: packages/swift/PublicTransportBinary.xcframework.zip
          if-no-files-found: error

  wheels:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The network data of transport-apis.
          submodules: true
      # The oldest Python that the package supports. The wheel holds no
      # code compiled against Python, so one wheel serves every version.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/python
          args: --release --locked --out dist --compatibility pypi
          manylinux: auto
      - name: Test the wheel
        shell: bash
        working-directory: packages/python
        run: |
          pip install dist/*.whl pytest
          pytest
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.runner }}
          path: packages/python/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The network data of transport-apis.
          submodules: true
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/python
          command: sdist
          args: --out dist
      # The source package has to hold everything the build reads.
      - name: Build and test from the source package
        working-directory: packages/python
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.tar.gz pytest
          "$RUNNER_TEMP/venv/bin/pytest"
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: packages/python/dist/*.tar.gz
          if-no-files-found: error

  crates-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The network data of transport-apis.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds each crate from its packaged files, the client against the
      # packaged core.
      - run: cargo publish --workspace --locked --dry-run

  # The jar of the Kotlin package, with the Rust library of every platform
  # from the wheels. The tests run against the library of this runner.
  maven-check:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The network data of transport-apis.
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: ${{ runner.temp }}/wheels
          merge-multiple: true
      - run: scripts/kotlin-natives.sh "$RUNNER_TEMP/wheels" "$RUNNER_TEMP/natives"
      # In the shell for the Android SDK of the runner, so that the build
      # covers the Android library too.
      - run: nix develop .#android-host-sdk -c gradle --project-dir packages/kotlin build publishToMavenLocal -PnativeLibraries="$RUNNER_TEMP/natives"
      - name: Check the jar and the Android library
        run: |
          jar=$(echo ~/.m2/repository/io/github/kiliankoe/publictransport/*/publictransport-*[0-9].jar)
          [ "$(unzip -Z1 "$jar" '*publictransport_uniffi.*' | wc -l)" -eq 5 ] ||
            { echo "::error::the jar does not hold five libraries"; exit 1; }
          aar=$(echo ~/.m2/repository/io/github/kiliankoe/publictransport-android/*/publictransport-android-*[0-9].aar)
          [ "$(unzip -Z1 "$aar" 'jni/*/libpublictransport_uniffi.so' | wc -l)" -eq 3 ] ||
            { echo "::error::the Android library does not hold three libraries"; exit 1; }

  # The package for npm, as the tarball that gets published.
  npm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The network data of transport-apis.
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Swatinem/rust-cache@v2
      - run: nix develop -c pnpm --dir packages/typescript install --frozen-lockfile
      - run: nix develop -c pnpm --dir packages/typescript build
      - run: nix develop -c pnpm --dir packages/typescript test
      - run: nix develop -c pnpm --dir packages/typescript pack --out "$RUNNER_TEMP/package.tgz"
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error

  # The documentation site, built from the READMEs and the examples.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The network data of transport-apis.
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Swatinem/rust-cache@v2
      - run: nix develop -c just site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/book
          # The default is one day, and the jobs before the deployment
          # wait for an approval.
          retention-days: 30

  # Everything above has passed. From here on the release is public, one
  # part after the other. Each of the five jobs skips what an earlier
  # attempt has published, so a failed one can be run again.
  tag:
    if: inputs.publish
    needs: [version, xcframework, wheels, sdist, crates-check, maven-check, npm-check, site]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHECKSUM: ${{ needs.xcframework.outputs.checksum }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: xcframework
          path: ${{ runner.temp }}
      - name: Point Package.swift at the binary
        run: |
          [[ $CHECKSUM =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no checksum of the binary"; exit 1; }
          sed -i "s|/releases/download/v[^/]*/|/releases/download/v$VERSION/|; s|^let binaryChecksum = \".*\"$|let binaryChecksum = \"$CHECKSUM\"|" Package.swift
          grep -q "/releases/download/v$VERSION/" Package.swift
          grep -q "^let binaryChecksum = \"$CHECKSUM\"$" Package.swift
      - name: Commit and tag
        run: |
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" > /dev/null; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "build(swift): point the package at the binary of $VERSION" Package.swift
          git tag "v$VERSION"
          # Fails if main has moved since the run began.
          git push --atomic origin HEAD:main "v$VERSION"
      - name: Create the release
        run: |
          # The section of this version, without its heading.
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release view "v$VERSION" > /dev/null 2>&1 ||
            gh release create "v$VERSION" "$RUNNER_TEMP/PublicTransportBinary.xcframework.zip" \
              --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

  crates:
    needs: [version, tag]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # For the token that crates.io gives this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
          # The network data of transport-apis.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The core first: the client needs it on the registry.
      - run: |
          for crate in publictransport publictransport-client; do
            if curl --silent --fail --output /dev/null --user-agent "$GITHUB_REPOSITORY release workflow" \
              "https://crates.io/api/v1/crates/$crate/$VERSION"; then
              echo "$crate $VERSION is published"
            else
              cargo publish --locked --package "$crate"
            fi
          done
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  pypi:
    needs: [version, tag]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/publictransport/${{ needs.version.outputs.version }}/
    permissions:
      # For the token that PyPI gives this workflow.
      id-token: write
    steps:
      # The wheels were built from the commit before the tagged one, which
      # differs from it in Package.swift only.
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  maven:
    needs: [version, tag]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://central.sonatype.com/artifact/io.github.kiliankoe/publictransport/${{ needs.version.outputs.version }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
          # The network data of transport-apis.
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: ${{ runner.temp }}/wheels
          merge-multiple: true
      - run: scripts/kotlin-natives.sh "$RUNNER_TEMP/wheels" "$RUNNER_TEMP/natives"
      # Maven Central takes a version once, and the whole of it or nothing.
      # The jar and the Android library go up together, so one stands for
      # both. Only a missing file means that the version is not there: any
      # other answer stops the job, so that an outage of Maven Central does
      # not lead to a second upload.
      - id: published
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --user-agent "$GITHUB_REPOSITORY release workflow" \
            "https://repo1.maven.org/maven2/io/github/kiliankoe/publictransport/$VERSION/publictransport-$VERSION.pom") || true
          case $status in
            200)
              echo "publictransport $VERSION is published"
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404) ;;
            *)
              echo "::error::Maven Central answered $status, so it is unknown whether $VERSION is published"
              exit 1
              ;;
          esac
      # On its own, so that only the upload runs with the secrets.
      - if: steps.published.outputs.published != 'true'
        run: nix develop .#android-host-sdk -c gradle --project-dir packages/kotlin build -PnativeLibraries="$RUNNER_TEMP/natives"
      - if: steps.published.outputs.published != 'true'
        run: nix develop .#android-host-sdk -c gradle --project-dir packages/kotlin publishAndReleaseToMavenCentral -PnativeLibraries="$RUNNER_TEMP/natives"
        env:
          # Waits until the version can be downloaded, not only until
          # Maven Central has accepted it.
          ORG_GRADLE_PROJECT_mavenCentralDeploymentValidation: PUBLISHED
          # Maven Central can take longer than the 15 minutes that the
          # plugin waits by default.
          ORG_GRADLE_PROJECT_SONATYPE_CLOSE_TIMEOUT_SECONDS: 3600
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: true
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  npm:
    needs: [version, tag]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@kiliankoe/publictransport/v/${{ needs.version.outputs.version }}
    permissions:
      # For the token that npm gives this workflow.
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The tarball was built from the commit before the tagged one, which
      # differs from it in Package.swift only.
      - uses: actions/download-artifact@v8
        with:
          name: npm
      # npm gives its token to npm 11.5.1 or newer, which this Node brings.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: |
          if npm view "@kiliankoe/publictransport@$VERSION" version > /dev/null 2>&1; then
            echo "@kiliankoe/publictransport $VERSION is published"
          else
            npm publish package.tgz --access public
          fi

  # After the packages, so that the site never describes a version that
  # the registries do not have.
  pages:
    needs: [crates, pypi, maven, npm]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
