name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which parts of the project a push or a pull request touches, so that
  # the jobs below run only for theirs. A change to the core runs all.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the list of files of a pull request.
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      swift: ${{ steps.filter.outputs.swift }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - Cargo.toml
              - Cargo.lock
              - crates/core/**
              - bindings/**
              - flake.nix
              - flake.lock
            rust:
              - *shared
              - crates/**
              - clippy.toml
              - deny.toml
              - Justfile
              - scripts/**
              # The generated Swift code is compared with the core.
              - packages/swift/Sources/**
              # The site includes the READMEs and every example.
              - site/**
              - examples/**
              - '**/README.md'
            python:
              - *shared
              - packages/python/**
              - examples/python/**
            swift:
              - *shared
              - Package.swift
              - packages/swift/**
              - examples/swift/**
              - scripts/build-swift.sh
              - scripts/swift-idioms.py
            kotlin:
              - *shared
              - packages/kotlin/**
              - examples/kotlin/**
              - scripts/kotlin-idioms.py

  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The network data of transport-apis.
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Swatinem/rust-cache@v2
      - run: nix fmt -- --check flake.nix
      - run: nix develop -c cargo fmt --all --check
      - run: nix develop -c cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: nix develop -c cargo test --workspace --all-features
      # The workspace build always has the uniffi feature on, through bindings/uniffi.
      - run: nix develop -c cargo clippy -p publictransport --all-targets -- -D warnings
      - run: nix develop -c cargo test -p publictransport
      - run: nix develop -c cargo deny check
      # Builds from the packaged files, which have to include every network
      # entry that is compiled in.
      - run: nix develop -c cargo package -p publictransport
      # Fetches the TRIAS and OJP schemas from GitHub.
      - run: nix develop -c scripts/validate-xml-requests.sh
      # The generated code of the Swift package is committed.
      - run: nix develop -c scripts/build-swift.sh check
      # The site includes the READMEs and the examples.
      - run: nix develop -c just site
      # Last, because they ask live servers, which can fail without a fault
      # in the code.
      - run: |
          for name in locations departures trips networks; do
            nix develop -c cargo run -p publictransport-examples --bin $name
          done

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # For a pull request its last commit, not the merge commit that
          # GitHub makes for the run, whose message has no type.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: DeterminateSystems/nix-installer-action@v23
      # Every commit after the first, in the format CONTRIBUTING.md describes.
      - run: nix develop -c committed "$(git rev-list --max-parents=0 HEAD)..HEAD"

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          # The network data of transport-apis.
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Swatinem/rust-cache@v2
      # Builds the Rust library and installs the package into .venv.
      - run: nix develop -c uv sync --locked
      - run: nix develop -c ruff check .
      - run: nix develop -c ruff format --check .
      - run: nix develop -c pyright
      - run: nix develop -c uv run --no-sync pytest
      - run: nix develop -c uv build --wheel
      - run: nix develop -c ruff check ../../examples/python
      - run: nix develop -c ruff format --check ../../examples/python
      - run: nix develop -c pyright ../../examples/python
      # Last, because they ask live servers, which can fail without a fault
      # in the code.
      - run: |
          for name in locations departures trips networks; do
            nix develop -c uv run --no-sync python ../../examples/python/$name.py
          done

  swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    # The same sources build for Apple platforms, where the tests would
    # need a macOS runner.
    container: swift:6.2
    steps:
      - run: apt-get update && apt-get install --yes curl build-essential
      - uses: actions/checkout@v7
        with:
          # The network data of transport-apis.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The static library alone: the Swift package links it.
      - run: cargo rustc -p publictransport-uniffi --lib --release --crate-type staticlib
      # The hand-written code; the generated file has its own style.
      - run: swift format lint --strict --recursive packages/swift/Sources/PublicTransport/Client.swift packages/swift/Sources/PublicTransport/Codable.swift packages/swift/Tests
      - run: swift format lint --strict --recursive --configuration packages/swift/.swift-format examples/swift
      - run: swift test -Xlinker -Ltarget/release

  kotlin:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The network data of transport-apis.
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Swatinem/rust-cache@v2
      # The hand-written code; the generated file is under build.
      - run: nix develop -c ktlint 'packages/kotlin/**/*.kt' 'packages/kotlin/**/*.kts' 'examples/kotlin/**/*.kt' 'examples/kotlin/**/*.kts' '!**/build/**'
      # Builds the Rust library, generates the model from it, runs the
      # tests and compiles the examples.
      - run: nix develop -c gradle --project-dir packages/kotlin build
      # Last, because they ask live servers, which can fail without a fault
      # in the code.
      - run: |
          for name in locations departures trips networks; do
            nix develop -c gradle --project-dir packages/kotlin --quiet :examples:$name
          done

  swift-macos:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    # Foundation differs between Linux and Apple platforms, and the
    # XCFramework is only built here.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          # The network data of transport-apis.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-swift.sh xcframework macos
      - run: swift test
        env:
          # The framework built above, not the one of the last release.
          PUBLICTRANSPORT_LOCAL_BINARY: 1
      - run: swift build --package-path examples/swift
        env:
          PUBLICTRANSPORT_LOCAL_BINARY: 1
      # Last, because they ask live servers, which can fail without a fault
      # in the code.
      - run: |
          for name in locations departures trips networks; do
            swift run --package-path examples/swift $name
          done
        env:
          PUBLICTRANSPORT_LOCAL_BINARY: 1

