# Weekly updates, one pull request per ecosystem. The prefix gives the
# titles and commits the format CONTRIBUTING.md describes.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /packages/python
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      actions:
        patterns: ["*"]
