# Weekly updates, one pull request per ecosystem. The prefix gives the
# titles and commits the format CONTRIBUTING.md describes.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Also what only Cargo.lock names: the wheels and the XCFramework are
    # built from it.
    allow:
      - dependency-type: all
    # wasm-bindgen is pinned to the version of its command line tool in
    # the flake, and the crates released with it each ask for exactly
    # one version of it. They are updated by hand, with the flake.
    ignore:
      - dependency-name: "wasm-bindgen*"
      - dependency-name: js-sys
      - dependency-name: web-sys
    commit-message:
      prefix: build(deps)
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /packages/python
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /packages/kotlin
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      kotlin:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /packages/typescript
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      typescript:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      actions:
        patterns: ["*"]
