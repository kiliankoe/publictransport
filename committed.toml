style = "conventional"
# No limit for the subject: the titles that Dependabot writes are long. No
# limit for the lines of a body either: a squash takes the description of
# a pull request as the body, and that is Markdown with a paragraph per line.
subject_length = 0
line_length = 0
# Subjects start in lower case after the type.
subject_capitalized = false
allowed_types = ["feat", "fix", "docs", "refactor", "perf", "test", "build", "ci", "chore"]
allowed_scopes = ["core", "client", "uniffi", "python", "swift", "kotlin", "typescript", "ci", "deps"]
