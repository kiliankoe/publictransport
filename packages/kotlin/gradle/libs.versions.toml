[versions]
kotlin = "2.4.21"
okhttp = "5.5.1"
android = "9.5.2"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
coroutines = "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
jna = "net.java.dev.jna:jna:5.19.1"
androidx-test-runner = "androidx.test:runner:1.7.0"
