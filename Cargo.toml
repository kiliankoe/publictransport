[workspace]
resolver = "3"
members = ["crates/*", "bindings/*", "examples/rust"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kiliankoe/publictransport"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Server responses are untrusted input; a malformed one must become an error.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

# For the XCFramework of the Swift package, which holds the library once
# per platform: a quarter of the size of a release build.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
