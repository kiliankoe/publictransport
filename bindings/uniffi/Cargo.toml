[package]
name = "publictransport-uniffi"
description = "The publictransport library as a shared or static library for Python, Swift and Kotlin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
# maturin and the other packaging tools run this to generate the bindings.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
publictransport = { path = "../../crates/core", features = ["uniffi"] }
# The same version as in publictransport.
uniffi = { version = "=0.32.2", features = ["cli"] }
